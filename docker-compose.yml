version: '3.8'

services:
  spring-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    container_name: spring-boot-app
    restart: unless-stopped
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M 
    depends_on:
      - db
  
  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=clientaddressdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 