name: Deploy to Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Instalar dependencias
        run: |
          mvn dependency:go-offline -Dmaven.test.skip=true -Dspring.jvm.memory="-Xmx512m -Xms256m"

      - name: Compilar aplicação
        run: mvn clean package -DskipTests -Dmaven.test.skip=true -Dspring.jvm.memory="-Xmx512m -Xms256m"
      
      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build e Push da imagem
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/java-hello-world:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/java-hello-worldo:${{ github.sha }}